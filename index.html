<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>SidAli — compiler + VM</title>
<style>:root {
  --bg: #0b0e14;
  --panel: #11151f;
  --panel-2: #0e121a;
  --line: #1e2633;
  --text: #d7e0ea;
  --muted: #6b7a90;
  --accent: #38e08b;
  --accent-2: #4aa8ff;
  --warn: #ffb454;
  --err: #ff6b6b;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  -webkit-text-size-adjust: 100%;
}

body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

.bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 8px 12px; background: var(--panel);
  border-bottom: 1px solid var(--line); flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 0.3px; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.brand .ver { color: var(--muted); font-weight: 400; font-size: 12px; }

.bar-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

button, select {
  font-family: var(--mono); font-size: 13px; color: var(--text);
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 11px; cursor: pointer;
}
button:hover, select:hover { border-color: #33425a; }
button.primary { background: var(--accent); color: #04140c; border-color: var(--accent); font-weight: 700; }
button.primary:hover { filter: brightness(1.08); }
button.ghost { background: transparent; }
button.rec { background: var(--err); border-color: var(--err); color: #fff; }

.workspace { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }

.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.editor-pane { border-right: 1px solid var(--line); }

.pane-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line);
  font-size: 12px; color: var(--muted);
}
.pane-head.sub { border-top: 1px solid var(--line); }
.pane-head .file { color: var(--accent-2); }

.editor-wrap { flex: 1; display: flex; min-height: 0; overflow: hidden; }
.gutter {
  width: 46px; padding: 12px 8px 12px 0; text-align: right; color: #3d4b60;
  background: var(--panel-2); overflow: hidden; user-select: none; font-size: 13px; line-height: 1.5;
}
#editor {
  flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--text);
  padding: 12px; font-family: var(--mono); font-size: 13px; line-height: 1.5;
  tab-size: 2; white-space: pre; overflow: auto;
}

.pane-foot { padding: 5px 12px; border-top: 1px solid var(--line); font-size: 12px; }

.output {
  flex: 1; margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  font-size: 13px; line-height: 1.55;
}
.output .err { color: var(--err); }
.output .ok { color: var(--accent); }
.output .dim { color: var(--muted); }

.verify { padding: 8px 12px; overflow: auto; max-height: 40%; font-size: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; margin: 3px 5px 3px 0;
  padding: 4px 8px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel-2);
}
.chip .k { color: var(--muted); }
.chip .v { color: var(--accent); }
.chip.bad .v { color: var(--err); }
.chip.warn .v { color: var(--warn); }
.hashline { margin: 4px 0; color: var(--muted); word-break: break-all; }
.hashline b { color: var(--accent-2); font-weight: 600; }

.muted { color: var(--muted); }

@media (max-width: 820px) {
  .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .editor-pane { border-right: 0; border-bottom: 1px solid var(--line); }
  .brand .ver { display: none; }
  button, select { padding: 8px 10px; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="dot"></span> SidAli <span class="ver">compiler + VM</span></div>
  <div class="bar-actions">
    <select id="example" title="Load example"></select>
    <button id="translate" class="ghost">English → SidAli</button>
    <button id="mic" class="ghost" title="Voice to code">🎤</button>
    <button id="run" class="primary">▶ Run</button>
  </div>
</header>

<main class="workspace">
  <section class="pane editor-pane">
    <div class="pane-head">
      <span class="file">main.sidali</span>
      <span id="cursor" class="muted">Ln 1, Col 1</span>
    </div>
    <div class="editor-wrap">
      <div id="gutter" class="gutter" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <div class="pane-foot">
      <span id="status" class="muted">ready</span>
    </div>
  </section>

  <section class="pane output-pane">
    <div class="pane-head">
      <span class="file">stdout</span>
      <span id="timing" class="muted">—</span>
    </div>
    <pre id="output" class="output"></pre>
    <div class="pane-head sub">
      <span class="file">verification layer</span>
    </div>
    <div id="verify" class="verify"></div>
  </section>
</main>

<script>/* SidAli playground UI. Engine is provided by the inlined `SidAli` global. */
(function () {
  'use strict';
  const E = window.SidAli;
  const $ = (id) => document.getElementById(id);

  const editor = $('editor');
  const gutter = $('gutter');
  const output = $('output');
  const verify = $('verify');
  const status = $('status');
  const timing = $('timing');
  const cursor = $('cursor');
  const exampleSel = $('example');
  const examples = window.SIDALI_EXAMPLES || [];

  // ---------- examples ----------
  examples.forEach((ex, i) => {
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = ex.name.replace(/^\d+-/, '').replace('.sidali', '');
    exampleSel.appendChild(o);
  });
  exampleSel.addEventListener('change', () => {
    const ex = examples[Number(exampleSel.value)];
    if (ex) { editor.value = ex.source; refreshGutter(); }
  });
  if (examples.length) { editor.value = examples[0].source; }

  // ---------- editor helpers ----------
  function refreshGutter() {
    const lines = editor.value.split('\n').length;
    let g = '';
    for (let i = 1; i <= lines; i++) g += i + '\n';
    gutter.textContent = g;
  }
  function updateCursor() {
    const upTo = editor.value.slice(0, editor.selectionStart);
    const line = upTo.split('\n').length;
    const col = upTo.length - upTo.lastIndexOf('\n');
    cursor.textContent = `Ln ${line}, Col ${col}`;
  }
  editor.addEventListener('input', () => { refreshGutter(); updateCursor(); });
  editor.addEventListener('keyup', updateCursor);
  editor.addEventListener('click', updateCursor);
  editor.addEventListener('scroll', () => { gutter.scrollTop = editor.scrollTop; });
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 2;
      refreshGutter();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
  });

  // ---------- run ----------
  function chip(k, v, cls) {
    const d = document.createElement('div');
    d.className = 'chip' + (cls ? ' ' + cls : '');
    d.innerHTML = `<span class="k">${k}</span><span class="v">${escapeHtml(String(v))}</span>`;
    return d;
  }
  function hashline(label, hash) {
    const d = document.createElement('div');
    d.className = 'hashline';
    d.innerHTML = `<b>${escapeHtml(label)}</b> ${escapeHtml(hash)}`;
    return d;
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function run() {
    const src = editor.value;
    output.textContent = '';
    verify.textContent = '';
    status.textContent = 'compiling…';
    let result;
    try {
      result = E.runSource(src);
    } catch (err) {
      status.textContent = 'compile error';
      const line = document.createElement('div');
      line.className = 'err';
      line.textContent = '✖ ' + (err && err.message ? err.message : String(err));
      output.appendChild(line);
      timing.textContent = '—';
      return;
    }

    // stdout
    for (const ln of result.output) {
      const d = document.createElement('div');
      d.className = 'ok';
      d.textContent = ln;
      output.appendChild(d);
    }
    if (result.error) {
      const d = document.createElement('div');
      d.className = 'err';
      d.textContent = '✖ ' + result.error;
      output.appendChild(d);
    }
    if (!result.output.length && !result.error) {
      const d = document.createElement('div');
      d.className = 'dim';
      d.textContent = '(no output)';
      output.appendChild(d);
    }

    // verification layer
    const s = result.stats;
    verify.appendChild(chip('instructions', s.instructions));
    verify.appendChild(chip('time', s.timeMs + ' ms'));
    verify.appendChild(chip('RAM lattice', s.ramUsed + ' B'));
    verify.appendChild(chip('ledger height', s.ledgerHeight));
    verify.appendChild(chip('ace used', result.ace.used + ' / ' + result.ace.limit));
    verify.appendChild(chip('ace safety', result.ace.safety, result.ace.safety === 'VIOLATED' ? 'bad' : ''));
    verify.appendChild(chip('tier', result.ace.tier));
    verify.appendChild(chip('witnesses', s.witnesses));

    // BLAKE3 witnesses + proof anchor
    const witnessHash = E.blake3(src);
    verify.appendChild(hashline('source BLAKE3', witnessHash));
    if (result.witnesses.length) {
      result.witnesses.slice(0, 6).forEach((w, i) => verify.appendChild(hashline('build witness ' + i, w)));
    }
    const anchor = E.proofAnchor([witnessHash, String(s.instructions), result.ace.safety]);
    verify.appendChild(hashline('proof anchor', anchor));

    // Dilithium demo signature over the program (real lattice arithmetic)
    try {
      const kp = E.dilithiumKeygen(witnessHash);
      const sig = E.dilithiumSign(src, kp);
      const ok = E.dilithiumVerify(src, sig, kp);
      verify.appendChild(chip('dilithium', ok ? 'valid' : 'invalid', ok ? '' : 'bad'));
      verify.appendChild(hashline('dilithium sig', sig.hash.slice(0, 64)));
    } catch (e) { /* signature is best-effort telemetry */ }

    // sigma kernel stability of the execution
    const lEff = Math.min(0.999, s.instructions / 1000000);
    const sig2 = E.sigmaKernel(lEff, 0);
    verify.appendChild(chip('L_eff', sig2.lEff.toFixed(6), sig2.lEffOk ? '' : 'bad'));
    verify.appendChild(chip('stable', String(sig2.stable), sig2.stable ? '' : 'bad'));

    // DNA
    const dnaLine = document.createElement('div');
    dnaLine.className = 'hashline';
    dnaLine.innerHTML = `<b>DNA</b> ${escapeHtml(result.dna.slice(0, 80))}…`;
    verify.appendChild(dnaLine);

    timing.textContent = s.timeMs + ' ms';
    status.textContent = result.error ? 'runtime error' : 'ok';
  }
  $('run').addEventListener('click', run);

  // ---------- English -> SidAli ----------
  $('translate').addEventListener('click', () => {
    const english = prompt('Describe what you want in English (or use the microphone):', 'build a social platform');
    if (english === null) return;
    applyEnglish(english);
  });

  function applyEnglish(text) {
    const dec = new E.GraphemeDecomposer().decompose(text);
    editor.value = dec.code;
    refreshGutter();
    const policy = E.alpPolicy(3, 0);
    status.textContent = `intent: ${dec.intent} · confidence ${dec.confidence.toFixed(2)} · RTA ${dec.rta.toFixed(2)} · ${policy.policy}`;
    run();
  }

  // ---------- voice ----------
  const mic = $('mic');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  if (SR) {
    rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (ev) => {
      const text = ev.results[0][0].transcript;
      mic.classList.remove('rec');
      mic.textContent = '🎤';
      applyEnglish(text);
    };
    rec.onerror = () => { mic.classList.remove('rec'); mic.textContent = '🎤'; status.textContent = 'speech error'; };
    rec.onend = () => { mic.classList.remove('rec'); mic.textContent = '🎤'; };
    mic.addEventListener('click', () => {
      try {
        mic.classList.add('rec');
        mic.textContent = '■';
        status.textContent = 'listening…';
        rec.start();
      } catch (e) {
        mic.classList.remove('rec'); mic.textContent = '🎤';
        status.textContent = 'mic unavailable';
      }
    });
  } else {
    mic.addEventListener('click', () => {
      status.textContent = 'SpeechRecognition not supported — use English → SidAli';
    });
  }

  refreshGutter();
  updateCursor();
  // Run the first example on load so the VM demonstrates real execution immediately.
  if (editor.value) run();
})();
</script>
